name: Build iOS (Xcode & IPA)

on:
  workflow_dispatch:
  push:
    branches: [codex/pulso-show-nativo]
    paths:
      - '.github/workflows/build-ios.yml'
      - 'ios/**'
      - 'engine/**'

jobs:
  build-ios:
    name: Build iOS (Xcode & IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS App Archive
        working-directory: ios/App
        shell: bash
        run: |
          set +e
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee "$RUNNER_TEMP/pulso-xcode.log"
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            python3 - "$RUNNER_TEMP/pulso-xcode.log" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          errors = [line.strip() for line in lines if re.search(r"\berror:", line, re.I)]
          for line in (errors or lines[-20:])[:20]:
              print("::error::" + line.replace("%", "%25").replace("\r", "%0D"))
          PY
          fi
          exit "$status"

      - name: Upload Xcode log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-Xcode-log
          path: ${{ runner.temp }}/pulso-xcode.log

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r PULSO-Multitrack.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-Multitrack-iOS-IPA
          path: build/PULSO-Multitrack.ipa
          retention-days: 14
