name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-Multitrack-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-ios:
    name: Build iOS (Xcode & IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App Archive
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r PULSO-Multitrack.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-Multitrack-iOS-IPA
          path: build/PULSO-Multitrack.ipa
          retention-days: 14
