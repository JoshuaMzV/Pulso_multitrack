name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permisos de ejecucion a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-Multitrack-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
